<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10101b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/aurora-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/aurora-192.png">
<title>Aurora — Premium Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- CSS -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/playlists.css">
<link rel="stylesheet" href="css/responsive.css">
<!-- Naya Dashboard CSS (sidebar.css ki jagah) -->
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/aurora-fixes.css">
<link rel="stylesheet" href="css/glassclay.css">
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-blobs">
  <div class="blob blob-1"></div><div class="blob blob-2"></div>
  <div class="blob blob-3"></div><div class="blob blob-4"></div>
</div>
<div class="bg-noise"></div>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<div class="app">
  
  <!-- ═══════════════ TOP BAR (Option 1) ═══════════════ -->
  <header class="topbar glass">
    <div class="topbar-left">
      <div class="logo">
        <i class="fa-solid fa-compact-disc logo-icon"></i>
        <span class="logo-text">Aurora</span>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Search songs, artists..." aria-label="Search">
        <button class="search-clear" id="searchClear" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
        <span class="search-kbd" id="searchKbd">Ctrl K</span>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <div class="topbar-right">
      <nav class="top-nav">
        <button class="nav-icon active" data-view="home" title="Home"><i class="fa-solid fa-house"></i></button>
        <button class="nav-icon" data-view="library" title="Library"><i class="fa-solid fa-music"></i></button>
        <button class="nav-icon" data-view="favorites" title="Favorites"><i class="fa-solid fa-heart"></i></button>
        <button class="nav-icon" data-view="recent" title="Recently Played"><i class="fa-solid fa-clock-rotate-left"></i></button>
      </nav>
      <div class="topbar-divider"></div>
      <div class="user-profile" id="userMenuBtn">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info">
          <div class="user-name">Guest</div>
        </div>
      </div>
      <button class="import-btn-top" id="importBtn" aria-label="Import songs" title="Import songs">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </header>

  <!-- ═══════════════ MAIN GRID ═══════════════ -->
  <div class="layout-grid">
    
    <!-- LEFT PANEL: LIBRARY (Option 2 & 4) -->
    <aside class="left-panel glass">
      <div class="panel-header">
        <h3>Your Library</h3>
        <span class="badge" id="libraryCount">0</span>
      </div>
      
      <!-- Quick Playlists -->
      <div class="left-playlists" id="leftPlaylists"></div>

      <!-- All Songs List -->
      <div class="panel-subheader">
        <span>All Songs</span>
      </div>
      <div class="library-list" id="libraryList"></div>
    </aside>

    <!-- CENTER PANEL: PLAYER + VISUALS (Option 1 & 3) -->
    <main class="center-panel glass">
      <div class="hero empty" id="hero">
        
        <div class="empty-state" id="emptyState">
          
<div class="empty-icon">
  <i class="fa-solid fa-music" aria-hidden="true"></i>
</div>

          <h2>No songs yet</h2>
          <p>Import tracks or drag &amp; drop audio files anywhere to get started.</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px">
            <button class="empty-cta" id="emptyImportBtn"><i class="fa-solid fa-plus"></i> Import Songs</button>
            <button class="empty-cta demo-cta" id="emptyDemoBtn" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 16px rgba(0,0,0,.3)"><i class="fa-solid fa-wand-magic-sparkles"></i> Play Demo</button>
          </div>
        </div>

        <div class="player-content" id="playerContent">
          <div class="album-art-wrap">
            <div class="album-glow" id="albumGlow"></div>
            <div class="vinyl" id="vinyl">
              <canvas class="visualizer" id="visualizer"></canvas>
              <img src="" alt="" class="album-art" id="albumArt">
              <div class="vinyl-disc" aria-hidden="true"><div class="vinyl-disc-inner"></div></div>
            </div>
          </div>

          <div class="song-info">
            <h1 class="song-title" id="songTitle">—</h1>
            <p class="song-artist" id="songArtist">—</p>
            <div class="badges" id="songBadges">
              <span class="badge format-badge" id="formatBadge">AUDIO</span>
              <span class="badge source-badge" id="sourceBadge">Local file</span>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-bar" id="progressBar" role="slider" tabindex="0">
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <div class="time-row">
              <span class="time" id="currentTime">0:00</span>
              <span class="time" id="totalTime">0:00</span>
            </div>
          </div>

          <div class="controls">
            <button class="ctrl-btn" id="shuffleBtn"><i class="fa-solid fa-shuffle"></i></button>
            <button class="ctrl-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="play-btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            <button class="ctrl-btn" id="repeatBtn"><i class="fa-solid fa-repeat"></i></button>
          </div>

          <div class="secondary-controls">
            <button class="ctrl-btn small" id="favoriteBtn" title="Favorite"><i class="fa-regular fa-heart"></i></button>
            <button class="ctrl-btn small" id="addToPlaylistBtn" title="Add to Playlist"><i class="fa-solid fa-folder-plus"></i></button>
            <button class="ctrl-btn small" id="eqBtn" title="Smart Equalizer & 3D Audio"><i class="fa-solid fa-sliders"></i></button>
            <button class="ctrl-btn small speed-btn" id="speedBtn" title="Playback Speed" style="font-size:11px;font-weight:700">1x</button>
            <button class="ctrl-btn small" id="timerBtn" title="Sleep Timer"><i class="fa-solid fa-moon"></i></button>
            <button class="ctrl-btn small" id="lyricsBtn" title="Lyrics"><i class="fa-solid fa-scroll"></i></button>
            <button class="ctrl-btn small" id="queueBtn" title="Queue"><i class="fa-solid fa-list-ul"></i></button>
            <button class="ctrl-btn small" id="helpBtn" title="Keyboard Shortcuts"><i class="fa-solid fa-circle-question"></i></button>
            <div class="volume-wrap">
              <button class="ctrl-btn small" id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
              <div class="volume-bar" id="volumeBar" role="slider" tabindex="0">
                <div class="volume-fill" id="volumeFill"></div>
                <div class="volume-thumb" id="volumeThumb"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL: QUEUE/LYRICS (Existing) -->
    <aside class="right-panel glass" id="rightPanel">
      <div class="tabs" role="tablist" aria-label="Music panel">
        <button class="tab active" data-tab="queue" role="tab" aria-controls="queuePane">Up Next</button>
        <button class="tab" data-tab="lyrics" role="tab" aria-controls="lyricsPane">Lyrics</button>
        <button class="tab" data-tab="playlists" role="tab" aria-controls="playlistsPane">Playlists</button>
        <button class="panel-close" id="closeRightPanelBtn" aria-label="Close panel" title="Close panel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="tab-content">
        <div class="tab-pane active" id="queuePane"><div class="queue-list" id="queueList"></div></div>
        <div class="tab-pane" id="lyricsPane"><div class="lyrics-list" id="lyricsList"></div></div>
        <div class="tab-pane" id="playlistsPane">
          <div id="playlistsList"></div>
          <div class="playlist-detail" id="playlistDetail"></div>
        </div>
      </div>
    </aside>

  </div>

  <!-- ═══════════════ FLOATING MOBILE MINI-PLAYER ═══════════════ -->
  <div class="mobile-mini-player glass clay" id="mobileMiniPlayer">
    <div class="mini-orb-preview" id="miniOrbPreview">
      <i class="fa-solid fa-compact-disc"></i>
    </div>
    <div class="mini-track-info" id="miniTrackInfo">
      <div class="mini-title" id="miniSongTitle">No track playing</div>
      <div class="mini-artist" id="miniSongArtist">Select a song</div>
    </div>
    <div class="mini-actions">
      <button class="mini-play-btn" id="miniPlayBtn" aria-label="Play/Pause"><i class="fa-solid fa-play"></i></button>
      <button class="mini-next-btn" id="miniNextBtn" aria-label="Next track"><i class="fa-solid fa-forward-step"></i></button>
    </div>
  </div>

  <!-- ═══════════════ MOBILE BOTTOM NAVIGATION ═══════════════ -->
  <nav class="mobile-nav glass" id="mobileNav">
    <button class="mobile-nav-btn active" data-target="player">
      <i class="fa-solid fa-compact-disc"></i>
      <span>Player</span>
    </button>
    <button class="mobile-nav-btn" data-target="library">
      <i class="fa-solid fa-book-open"></i>
      <span>Library</span>
    </button>
    <button class="mobile-nav-btn" data-target="queue">
      <i class="fa-solid fa-list-ul"></i>
      <span>Queue</span>
    </button>
    <button class="mobile-nav-btn" data-target="eq">
      <i class="fa-solid fa-sliders"></i>
      <span>Equalizer</span>
    </button>
  </nav>
</div>

<!-- TOASTS, MODAL, AUDIO -->
<div class="toast-container" id="toastContainer"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal glass" id="modalContent"></div>
</div>
<input type="file" id="fileInput" accept="audio/*" multiple hidden>
<audio id="audio" crossorigin="anonymous"></audio>

<!-- JS -->
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/dom.js"></script>
<script src="js/audio.js"></script>
<script src="js/visualizer.js"></script>
<script src="js/render.js"></script>
<script src="js/import.js"></script>
<script src="js/playlists.js"></script>
<script src="js/search.js"></script>
<script src="js/modals.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/main.js"></script>
<script>
// PWA support only: keeps the existing AURORA interface unchanged.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((error) => console.warn("AURORA offline support could not be registered:", error));
  });
}
</script>
</body>
</html>
